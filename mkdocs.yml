site_name: beambugs
site_description: Evidence for defects in accelerator and beam-physics codes
repo_url: https://github.com/nikitakuklev/beambugs
repo_name: nikitakuklev/beambugs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Codes:
      - Bmad: bmad/index.md
      - ImpactX: impactx/index.md
      - Xsuite: xsuite/index.md
      - SciBmad: scibmad/index.md
      - Elegant: elegant/index.md
      - PyORBIT: pyorbit/index.md

hooks:
  - hooks/upstream_state.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Mark issues and PRs filed from beambugs evidence in the code tables' Issue and PR columns.
  mark_filed: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/filters.js

validation:
  nav:
    omitted_files: ignore
