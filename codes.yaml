# Codes exported into beambugs. `ledger` is the private ledger directory the
# exporter reads; it is only needed to regenerate docs/, not to build the site.
# `branch` is the development branch whose head makes a run current; `repositories`
# maps the package prefix of a provenance ref (`xtrack 0.118.2`) to its repository,
# and a ref without a prefix belongs to `repository`. An optional `merged` map
# ({old ID: absorbing ID}) lets a published entry leave the site after its
# defect was merged into another entry; no other published entry may leave.
bmad:
  name: Bmad
  homepage: https://www.classe.cornell.edu/bmad/
  repository: bmad-sim/bmad-ecosystem
  branch: main
  repositories: {}
  ledger: /mnt/apollo/ref_docs/bmad/upstream_defects
  areas:
    tracking.md: Tracking, RF, fields and spin
    optics.md: Optics
    collective.md: Collective effects
    lattice_io.md: Lattices, particles and I/O
    translators.md: Translators
    tao.md: Tao
  modules: []
  run: |
    1. Build the Bmad ecosystem from source with GNU Fortran, double precision, OpenMP enabled and
       serial Bmad libraries: configure `util/dist_prefs` for GNU Fortran and the installed
       dependencies, source `util/dist_source_me`, run `util/dist_build_production`, then run `mk`
       inside `regression_tests`. This builds Tao, `bmad_to_mad_sad_elegant` and the regression
       executables.
    2. Keep the complete build tree, including its CMake compile/link recipes, libraries, Fortran
       module files and the compiler that built them; the reproducers compile inline Fortran with
       those recipes.
    3. Set `BMAD_DIST` to that tree's absolute path (the directory containing `production` and
       `regression_tests`) and `BMAD_SOURCE` to the matching ecosystem source tree; a distribution
       build containing its archived sources can serve both variables.
    4. Download a reproducer and the `_*.py` helpers linked on its entry page from the shared
       [helpers directory](helpers/index.md), and save the helpers beside the script.
    5. Run `python <ID>.py` with `OMP_NUM_THREADS=1`, one script per process.
impactx:
  name: ImpactX
  homepage: https://impactx.readthedocs.io
  repository: BLAST-ImpactX/impactx
  branch: development
  repositories: {}
  ledger: /mnt/apollo/ref_docs/impactx/upstream_defects
  areas:
    tracking.md: Tracking
    envelope.md: Envelope
    collective.md: Collective effects
    particles_io.md: Particles and I/O
    python_api.md: Python API
  # Modules provided by the code's own package; other imports are listed on the code page.
  modules: [impactx, amrex]
  # Shown once on the code page, above the generated list of extra packages.
  run: |
    1. Install the CPU build of ImpactX with its Python bindings: `pip install impactx-noacc` for a
       release, or a source build for a `development` commit.
    2. Download a reproducer and the `_*.py` helpers linked on its entry page from the shared
       [helpers directory](helpers/index.md), and save the helpers beside the script.
    3. Run `python <ID>.py`, one script per process.
xsuite:
  name: Xsuite
  homepage: https://xsuite.readthedocs.io
  repository: xsuite/xsuite
  branch: main
  repositories:
    xsuite: xsuite/xsuite
    xtrack: xsuite/xtrack
    xfields: xsuite/xfields
    xpart: xsuite/xpart
    xobjects: xsuite/xobjects
    xdeps: xsuite/xdeps
    xcoll: xsuite/xcoll
  ledger: /mnt/apollo/ref_docs/xsuite/upstream_defects
  areas:
    tracking.md: Tracking
    optics_matching.md: Optics and matching
    collective.md: Collective effects
    lattice_particles_io.md: Lattices, particles and I/O
    contexts_kernels.md: Contexts and kernels
  modules: [xsuite, xtrack, xpart, xobjects, xfields, xdeps, xcoll, xwakes]
  run: |
    1. Install Xsuite (`pip install xsuite`).
    2. Build its prebuilt CPU kernels with `xsuite-prebuild regenerate`. Scripts that use the
       `_prebuilt` helper forbid kernel compilation and run only these kernels.
    3. Download a reproducer and the `_*.py` helpers linked on its entry page from the shared
       [helpers directory](helpers/index.md), and save the helpers beside the script.
    4. Run `python <ID>.py`, one script per process.
scibmad:
  name: SciBmad
  homepage: https://github.com/bmad-sim/SciBmad.jl
  repository: bmad-sim/SciBmad.jl
  branch: main
  repositories:
    SciBmad: bmad-sim/SciBmad.jl
    BeamTracking: bmad-sim/BeamTracking.jl
    Beamlines: bmad-sim/Beamlines.jl
    GTPSA: bmad-sim/GTPSA.jl
    NonlinearNormalForm: bmad-sim/NonlinearNormalForm.jl
    SpaceCharge: bmad-sim/SpaceCharge.jl
    FundamentalFrequencies: bmad-sim/FundamentalFrequencies.jl
    AtomicAndPhysicalConstants: bmad-sim/AtomicAndPhysicalConstants.jl
    BatchSolve: mattsignorelli/BatchSolve.jl
    bmad-ecosystem: bmad-sim/bmad-ecosystem
  ledger: /mnt/apollo/ref_docs/scibmad/upstream_defects
  areas:
    tracking.md: Tracking
    optics_maps.md: Optics and maps
    collective.md: Collective effects and spin
    lattice_api.md: Lattice and API
  modules: []
  run: |
    1. Install Julia.
    2. In one Julia environment, add SciBmad, BeamTracking, AtomicAndPhysicalConstants and
       SpaceCharge. A package at an unreleased commit is added as `] add <Package>#<commit>`.
    3. Download a reproducer. For a Python launcher (`<ID>.py`), also download the `_*.py` helpers
       linked on its entry page from the shared [helpers directory](helpers/index.md) and save them
       beside the script.
    4. Run `julia <ID>.jl` (or `python <ID>.py`) in that environment with one thread
       (`JULIA_NUM_THREADS=1`), one script per process.
elegant:
  name: Elegant
  homepage: https://ops.aps.anl.gov/elegant.html
  repository: rtsoliday/elegant
  branch: master
  repositories:
    SDDS: rtsoliday/SDDS
  ledger: /mnt/apollo/ref_docs/elegant/upstream_defects
  areas:
    tracking.md: Tracking
    optics.md: Optics
    collective.md: Collective effects
    scattering.md: Scattering and pressure
    lattice_io.md: Lattices, particles and I/O
  modules: []
  run: |
    1. Build serial Elegant and the SDDS tools from source
       ([rtsoliday/elegant](https://github.com/rtsoliday/elegant) and
       [rtsoliday/SDDS](https://github.com/rtsoliday/SDDS); CPU, no CUDA). For MPI runs, also build
       Pelegant with Open MPI.
    2. Put the `elegant` and SDDS `bin` directories on `PATH` and set `RPN_DEFNS` to the `defns.rpn`
       file of SDDS; Elegant does not start without it.
    3. Download a reproducer and the `_*.py` helpers linked on its entry page from the shared
       [helpers directory](helpers/index.md), and save the helpers beside the script.
    4. Run `python <ID>.py`, which runs serial Elegant. Most scripts also accept `--mpi`, which adds a
       3-rank Pelegant run of the same cases and needs Pelegant and Open MPI `mpirun` on `PATH`.
pyorbit:
  name: PyORBIT
  homepage: https://github.com/PyORBIT-Collaboration/PyORBIT3
  repository: PyORBIT-Collaboration/PyORBIT3
  branch: main
  repositories: {}
  ledger: /mnt/apollo/ref_docs/pyorbit/upstream_defects
  areas:
    tracking.md: Tracking
    optics.md: Optics
    parsers.md: Lattice import
    lattice_api.md: Lattice API
    collective.md: Collective effects
    particles_io.md: Particles and I/O
    diagnostics.md: Diagnostics
    elements.md: Elements and apertures
    bindings.md: Bindings and build
  modules: [orbit]
  run: |
    1. Build PyORBIT3 from source; the build needs a C++ compiler and FFTW. In a clone of the
       repository, run `pip install --config-settings=setup-args=-DUSE_MPI=none .`.
    2. Run `python <ID>.py` with `OMP_NUM_THREADS=1`, one script per process.
